version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tdsnap
      POSTGRES_USER: tdsnap
      POSTGRES_PASSWORD: tdsnap123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://tdsnap:tdsnap123@postgres:5432/tdsnap
      - REDIS_URL=redis://redis:6379
      - ARASAAC_API_URL=https://api.arasaac.org
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
